<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Card</title>
    <link rel="stylesheet" href="../static/css/test.css">
</head>
<body>
<div class="job-card">
    <!-- 태그 -->
    <div class="tags">
        <span class="tag popular">주간 인기</span>
        <span class="tag no-experience">경력 무관</span>
        <span class="tag adoptionStatus">상시 채용</span>
    </div>
    <!-- 카드 내용 -->
    <div class="card-content">
        <div class="logo">
            <img src="tossbank-logo.png" alt="Toss Bank Logo">
        </div>
        <div class="info">
            <h3 class="position">서버 개발자 (대학 연계 채용)</h3>
            <p class="company">토스뱅크</p>
            <p class="location"><i class="icon-location"></i> 서울</p>
        </div>
    </div>
    <!-- 조회수 -->
    <div class="footer">
        <p class="views"><i class="icon-eye"></i> 4953번 조회</p>
        <i class="icon-star"></i>
    </div>
</div>
</body>
</html>
