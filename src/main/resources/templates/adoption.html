<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무료 분양 모아보기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel ="stylesheet" type ="text/css" th:href="@{/css/styles.css}">
</head>
<body>
<!-- Header -->
<div class="container">
    <header class="navbar">
        <div class="logo">
            <img th:src="@{/image/logo.png}" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">무료 분양 </a></li>
                <li><a href="#">분실된 동물들</a></li>
                <li><a href="#">분실 목격된 동물들</a></li>
            </ul>
        </nav>
    </header>

</div>

<!-- Main Section -->
<main>
    <div class="container">
        <!-- Title -->
        <h1 class="page-title">무료 분양 모아보기</h1>
        <p class="subtitle">여러 사이트에 있는 무료 분양 글들을 한 곳에서 모아보세요</p>

        <!-- Filters -->
        <div class="filters">
            <select>
                <option value="all">동물 종류</option>
                <option value="dog">강아지</option>
                <option value="cat">고양이</option>
            </select>
            <select>
                <option value="all">지역</option>
                <option value="seoul">서울</option>
                <option value="ny">New York</option>
            </select>
        </div>

        <!-- Item List -->
        <div class="item-list" th:each= "adoption: ${adoptions.content}">
            <div class="item">
                <!-- 태그 -->
                <div class="tags">
                    <span class="tag species" th:text="${adoption.species.korean}"></span>
                    <span class="tag source" th:text="${adoption.source.korean}">주세요닷컴</span>
                    <span class="tag adoptionStatus" th:text="${adoption.adoptionStatus.korean}">분양 완료</span>
                </div>
                <!-- 카드 내용 -->
                <div class="card-body">
                    <img th:src="${adoption.thumbnailUrl}" alt="썸네일">
                    <div class="info">
                        <p class="title" th:text="${adoption.title}">외모도 성격까지도 너무나 사랑스러운 뱅갈...</p>
                        <p class="breed"  th:text="${adoption.breed}">샴</p>
                        <p class="detail" th:text="${adoption.region + ' | ' + adoption.age}">서울 | 4년 4개월</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
<!--            <a href="#" class="prev">&lt;</a> &lt;!&ndash; '<' &ndash;&gt;-->
            <a href="#" class="page active">1</a>
            <a href="#" class="page">2</a>
            <a href="#" class="page">3</a>
<!--            <a href="#" class="next">&gt;</a> &lt;!&ndash; '>' &ndash;&gt;-->
        </div>
    </div>
</main>
</body>
</html>
