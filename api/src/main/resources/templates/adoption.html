<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무료 분양 모아보기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel ="stylesheet" type ="text/css" th:href="@{/css/styles.css}">
    <script th:src="@{/js/adoptionPage.js}"></script>
</head>
<body>
<!-- Header -->
<div class="container">
    <header class="navbar">
        <div class="logo">
            <img th:src="@{/image/image.png}" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="/free-adoption">무료 분양 </a></li>
<!--                <li><a href="#">분실된 동물들</a></li>-->
<!--                <li><a href="#">분실 목격된 동물들</a></li>-->
            </ul>
        </nav>
    </header>

</div>

<!-- Main Section -->
<main>
    <div class="container">
        <!-- Title -->
        <h1 class="page-title">무료 분양 모아보기</h1>
        <p class="subtitle">여러 사이트에 있는 무료 분양 글들을 한 곳에서 모아보세요</p>

        <!-- Filters -->
        <div class="filters">
            <label>
                <select name ="species">
                    <option value="all">동물 전체</option>
                    <option th:each="species : ${species}"
                            th:value="${species.name}"
                            th:text="${species.korean}"
                            th:selected="${species==selectedSpecies}">
                    </option>
                </select>
                <select name ="region">
                    <!--<option value="all">전국</option>-->
                    <option th:each="region : ${regions}"
                            th:value="${region.name}"
                            th:text="${region.korean}"
                            th:selected="${region==selectedRegion}">
                    </option>
                </select>
            </label>
            <!-- 검색 버튼 -->
            <button id="searchButton" onclick="clickSearchButton()">검색</button>
        </div>

        <!-- Item List -->
        <div class="item-list" >
            <div class="item"
                 th:each="adoption : ${adoptionPages.content}"
                 th:attr="data-id=${adoption.id}, data-url=${adoption.originalUrl}"
                 onclick="clickAdoption(this)">
                <!-- 태그 -->
                <div class="top-bar">
                    <div class="tags">
                        <span class="tag adoptionStatus"
                              th:text="${adoption.adoptionStatus.korean}"
                              th:style="${'background-color: '+ adoption.adoptionStatus.color}">분양 완료</span>
                        <span class="tag species"
                              th:text="${adoption.species.korean}"
                              th:style="${'background-color: '+ adoption.species.color}"></span>
                    </div>
                    <div class="etc-info">

                        <div class="viewCount"
                             th:text="${'조회수:' + adoption.viewCount}">
                    </div>


                    </div>
                </div>

                <!-- 카드 내용 -->
                <div class="card-body">
                    <img th:src="${adoption.thumbnailUrl}" alt="썸네일 없음" th:onerror="|this.onerror=null;this.src='@{/image/paw.png}'|">
                    <div class="info">
                        <p class="title" th:text="${adoption.title}">외모도 성격까지도 너무나 사랑스러운 뱅갈...</p>
                        <p class="breed"  th:text="${adoption.breed+' · '+ adoption.gender.korean+ ' · ' + adoption.age}">샴</p>
                        <p class="detail region" th:text="${adoption.region  + ' · ' + #temporals.format(adoption.createdAt, 'yyyy-MM-dd') +' · ' +'출처:'+adoption.source.korean}">서울 · 4년 4개월</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <!-- Pagination -->
        <div class="pagination">
            <!-- 이전 페이지 번호들 -->
            <a th:each="pageNum : ${pagination.prevPages}"
               th:href="@{/free-adoption(page=${pageNum}, species=${selectedSpecies}, region=${selectedRegion})}"
               th:text="${pageNum}"
               class="page">
            </a>

            <!-- 현재 페이지 표시 -->
            <span class="page active" th:text="${pagination.currentPage}"></span>

            <a th:each="pageNum : ${pagination.nextPages}"
               th:href="@{/free-adoption(page=${pageNum}, species=${selectedSpecies}, region=${selectedRegion})}"
               th:text="${pageNum}"
               class="page">
            </a>
        </div>
    </div>
</main>
</body>
</html>
