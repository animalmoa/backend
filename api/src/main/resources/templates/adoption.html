<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-085RZ93ZDQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-085RZ93ZDQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>집사야 | 강아지, 고양이 무료 분양 한 곳에서 모아보기</title>
    <meta name="description"
          content="여러 사이트에 있는 강아지·고양이 무료 분양 글들을 한 곳에서 모아보세요.">

    <link rel="canonical" href="https://jipsaya.com/adoption/free"/>
    <meta property="og:url" content="https://jipsaya.com/adoption/free">

    <!-- 파라미터가 있을 때만 noindex(색인 생성 안 됨) -->
    <th:block th:if="${noindex}">
        <meta name="robots" content="noindex,follow" />
    </th:block>


    <link rel="icon" th:href="@{/image/icon.png}">
    <link rel="apple-touch-icon" th:href="@{/image/icon.png}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel ="stylesheet" type ="text/css" th:href="@{/css/styles.css}">
    <script th:src="@{/js/adoptionPage.js}"></script>
</head>
<body>
<!-- Header -->
<div class="container">
    <header class="navbar">
        <div class="logo">
            <img th:src="@{/image/image.png}" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="/adoption/free">무료 분양 </a></li>
<!--                <li><a href="#">분실된 동물들</a></li>-->
<!--                <li><a href="#">분실 목격된 동물들</a></li>-->
            </ul>
        </nav>
    </header>

</div>

<!-- Main Section -->
<main>
    <div class="container">
        <!-- Title -->
        <div class="page-title">
            <h1 class="title">무료 분양 모아보기</h1>
            <p class="subtitle">여러 사이트에 있는 무료 분양 글들을 한 곳에서 모아보세요</p>
        </div>

        <!-- Filters -->
        <div class="author-filter">
            <a th:href="@{/adoption/free(species=${selectedSpecies}, region=${selectedRegion},personal=${true})}"
               th:class="${personal == true} ? 'active' : ''">
                개인분양
            </a>
            <a th:href="@{/adoption/free(species=${selectedSpecies}, region=${selectedRegion}, personal=${false})}"
               th:class="${personal == false} ? 'active' : ''">
                기관분양
            </a>
        </div>

        <form th:action="@{/adoption/free}" method="get" class="filters">
            <input type="hidden" name="personal" th:value="${personal}"/>
            <label>
                <select name="species">
                    <option value="UNKNOWN">동물 전체</option>
                    <option th:each="species : ${species}"
                            th:value="${species.name}"
                            th:text="${species.korean}"
                            th:selected="${species==selectedSpecies}">
                    </option>
                </select>
                <select name="region">
                    <option value="WIDE">전국</option>
                    <option th:each="region : ${regions}"
                            th:value="${region.name}"
                            th:text="${region.korean}"
                            th:selected="${region==selectedRegion}">
                    </option>
                </select>
            </label>
            <button type="submit">검색</button>
        </form>

        <!-- Item List -->
        <div class="item-list" >
            <div class="item"
                 th:each="adoption : ${adoptionPages.content}"
                 th:attr="data-id=${adoption.id}, data-url=${adoption.originalUrl}"
                 onclick="clickAdoption(this)">
                <!-- 태그 -->
                <div class="top-bar">
                    <div class="tags">
                        <span class="tag adoptionStatus"
                              th:text="${adoption.adoptionStatus.korean}"
                              th:style="${'background-color: '+ adoption.adoptionStatus.color}">분양 완료</span>
                        <span class="tag species"
                              th:text="${adoption.species.korean}"
                              th:style="${'background-color: '+ adoption.species.color}"></span>
                    </div>
<!--                    <div class="etc-info">-->
<!--                        <div class="viewCount"-->
<!--                             th:text="${'조회수:' + adoption.viewCount}">-->
<!--                        </div>-->
<!--                    </div>-->
                </div>

                <!-- 카드 내용 -->
                <div class="card-body">
                    <img class="thumbnail" th:src="${adoption.thumbnailUrl}" alt="썸네일 없음" th:onerror="|this.onerror=null;this.src='@{/image/icon.png}'|">
                    <div class="info">
                        <p class="title" th:text="${adoption.title}">외모도 성격까지도 너무나 사랑스러운 뱅갈...</p>
                        <p class="breed"  th:text="${adoption.breed+' · '+ adoption.gender.korean+ ' · ' + adoption.age}">샴</p>
                        <p class="detail_region_source">
                            <span th:text="${adoption.region}"></span>
                            <span th:if = "${personal}" th:text="' · ' + ${#temporals.format(adoption.createdAt, 'yyyy-MM-dd')}"></span>
                            <span th:text="' · 출처:' + ${adoption.source.korean}"></span>
                            <img class="source_logo"
                                 th:src="@{/image/{file}(file=${#strings.toLowerCase(adoption.source.name()) + '_logo.png'})}"
                                 onerror="this.style.display='none'">
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <!-- 이전 페이지 번호들 -->
            <a th:each="pageNum : ${pagination.prevPages}"
               th:href="@{/adoption/free(page=${pageNum}, species=${selectedSpecies}, region=${selectedRegion}, personal=${personal})}"
               th:text="${pageNum}"
               class="page">
            </a>

            <!-- 현재 페이지 표시 -->
            <span class="page active" th:text="${pagination.currentPage}"></span>

            <a th:each="pageNum : ${pagination.nextPages}"
               th:href="@{/adoption/free(page=${pageNum}, species=${selectedSpecies}, region=${selectedRegion}, personal=${personal})}"
               th:text="${pageNum}"
               class="page">
            </a>
        </div>
    </div>
</main>
</body>
</html>
